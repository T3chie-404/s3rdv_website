<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZ Device Monitor - Unified Network Monitoring</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/branding/square/S3V_Square_Transparent symbol_3k_med.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/branding/square/S3V_Square_Transparent symbol_3k_med.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/branding/square/S3V_Square_Transparent symbol_3k_med.png">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Dark theme with great contrasting colors */
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --bg-card: #1e1e2e;
            --bg-hover: #2a2a3e;
            
            /* Vibrant accent colors */
            --accent-primary: #00d4ff;
            --accent-secondary: #ff6b35;
            --accent-success: #00ff88;
            --accent-warning: #ffaa00;
            --accent-danger: #ff4757;
            --accent-purple: #a855f7;
            
            /* Text colors */
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            
            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-warning: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            
            /* Shadows */
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            background: var(--gradient-primary);
            border-radius: 15px;
            box-shadow: var(--shadow-lg);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .status-indicator {
            display: inline-block;
            padding: 8px 16px;
            background: var(--accent-success);
            color: var(--bg-primary);
            border-radius: 25px;
            font-weight: bold;
            margin: 10px 0;
            box-shadow: var(--shadow-sm);
        }

        /* Network Selector */
        .network-selector {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 15px;
            box-shadow: var(--shadow-md);
        }

        .network-selector h3 {
            margin-bottom: 15px;
            color: var(--accent-primary);
        }

        .network-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .network-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .network-btn:hover {
            background: var(--bg-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .network-btn.active {
            background: var(--gradient-primary);
            color: var(--text-primary);
            box-shadow: var(--shadow-glow);
        }

        /* Device Grid */
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .device-card {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .device-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-primary);
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .device-code {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-primary);
        }

        .network-badge {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .network-badge.testnet {
            background: linear-gradient(135deg, #ffaa00, #ff6b35);
            color: var(--text-primary);
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .network-badge.mainnet-beta {
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            color: var(--bg-primary);
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .device-info {
            margin-bottom: 15px;
        }

        .device-info p {
            margin: 5px 0;
            color: var(--text-secondary);
        }

        .device-info .location {
            color: var(--accent-purple);
            font-weight: 500;
        }

        .device-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 8px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .status-online {
            color: var(--accent-success);
        }

        .status-offline {
            color: var(--accent-danger);
        }

        /* Loading and Error States */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .error {
            background: var(--accent-danger);
            color: var(--text-primary);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        /* Stats Summary */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .summary-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-primary);
        }

        .summary-label {
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .device-grid {
                grid-template-columns: 1fr;
            }

            .network-buttons {
                flex-direction: column;
                align-items: center;
            }

            .network-btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🚀 DoubleZero Device Monitor</h1>
            <p>Real-time network monitoring with unified testnet and mainnet-beta data</p>
            <div class="status-indicator" id="statusIndicator">
                ⚡ Online - Monitoring Both Networks
            </div>
        </div>

        <!-- Network Selector -->
        <div class="network-selector">
            <h3>🌐 Network Filter</h3>
            <div class="network-buttons">
                <button class="network-btn active" data-network="all" onclick="filterByNetwork('all')">
                    📊 All Networks
                </button>
                <button class="network-btn" data-network="testnet" onclick="filterByNetwork('testnet')">
                    🧪 Testnet
                </button>
                <button class="network-btn" data-network="mainnet-beta" onclick="filterByNetwork('mainnet-beta')">
                    🌟 Mainnet-Beta
                </button>
            </div>
        </div>

        <!-- Stats Summary -->
        <div class="stats-summary" id="statsSummary">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Loading State -->
        <div class="loading" id="loading">
            <h3>🔄 Loading device data...</h3>
            <p>Fetching real-time monitoring information</p>
        </div>

        <!-- Error State -->
        <div class="error" id="error" style="display: none;">
            <h3>⚠️ Connection Error</h3>
            <p id="errorMessage">Unable to connect to monitoring service</p>
        </div>

        <!-- Device Grid -->
        <div class="device-grid" id="deviceGrid" style="display: none;">
            <!-- Will be populated by JavaScript -->
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://api.s3rdv.com';
        
        // Global state
        let allDevices = [];
        let currentFilter = 'all';
        let isLoading = false;

        // DOM elements
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const deviceGrid = document.getElementById('deviceGrid');
        const statsSummary = document.getElementById('statsSummary');
        const statusIndicator = document.getElementById('statusIndicator');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 DZ Monitor initialized');
            fetchData();
            setInterval(fetchData, 30000); // Refresh every 30 seconds
            
            // Debug: Log button states
            setTimeout(() => {
                const buttons = document.querySelectorAll('.network-btn');
                console.log(`Found ${buttons.length} network buttons`);
                buttons.forEach(btn => {
                    console.log(`Button: ${btn.dataset.network}, Active: ${btn.classList.contains('active')}, Disabled: ${btn.disabled}`);
                });
            }, 1000);
        });

        // Fetch data from API
        async function fetchData() {
            if (isLoading) return;
            isLoading = true;

            try {
                showLoading();
                
                // Fetch all devices (no network filter on API call for unified data)
                const response = await fetch(`${API_BASE}/api/devices`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'API request failed');
                }

                allDevices = data.data || [];
                updateDisplay();
                hideError();
                
            } catch (err) {
                console.error('Error fetching data:', err);
                showError(`Failed to load device data: ${err.message}`);
            } finally {
                isLoading = false;
                hideLoading();
            }
        }

        // Filter devices by network
        function filterByNetwork(network) {
            // Prevent multiple rapid clicks
            if (currentFilter === network) return;
            
            currentFilter = network;
            
            // Update button states
            document.querySelectorAll('.network-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.disabled = false; // Ensure buttons are never disabled
                if (btn.dataset.network === network) {
                    btn.classList.add('active');
                }
            });

            updateDisplay();
            
            console.log(`Filtered to: ${network}, showing ${getFilteredDevices().length} devices`);
        }

        // Update display with current filter
        function updateDisplay() {
            const filteredDevices = getFilteredDevices();
            renderDevices(filteredDevices);
            renderStats(filteredDevices);
        }

        // Get filtered devices based on current filter
        function getFilteredDevices() {
            if (currentFilter === 'all') {
                return allDevices;
            }
            return allDevices.filter(device => device.network === currentFilter);
        }

        // Render device cards
        function renderDevices(devices) {
            if (devices.length === 0) {
                deviceGrid.innerHTML = '<div class="loading"><h3>📭 No devices found</h3><p>No devices match the current filter</p></div>';
                deviceGrid.style.display = 'block';
                return;
            }

            const deviceCards = devices.map(device => createDeviceCard(device)).join('');
            deviceGrid.innerHTML = deviceCards;
            deviceGrid.style.display = 'grid';
        }

        // Create device card HTML
        function createDeviceCard(device) {
            const latency = device.latency ? `${device.latency}ms` : 'N/A';
            const status = device.latency_status || 'unknown';
            const statusClass = status === 'online' ? 'status-online' : 'status-offline';
            const networkClass = device.network === 'testnet' ? 'testnet' : 'mainnet-beta';
            const networkDisplay = device.network === 'testnet' ? 'TESTNET' : 'MAINNET';
            
            return `
                <div class="device-card">
                    <div class="device-header">
                        <div class="device-code">${device.code || 'Unknown'}</div>
                        <div class="network-badge ${networkClass}">${networkDisplay}</div>
                    </div>
                    
                    <div class="device-info">
                        <p class="location">📍 ${device.location_name || 'Unknown Location'}</p>
                        <p>🔑 ${device.pubkey ? device.pubkey.substring(0, 20) + '...' : 'N/A'}</p>
                        <p>🌐 ${device.public_ip || 'N/A'}</p>
                        <p>🏢 ${device.provider || 'Unknown Provider'}</p>
                    </div>
                    
                    <div class="device-stats">
                        <div class="stat-item">
                            <div class="stat-value ${statusClass}">${latency}</div>
                            <div class="stat-label">Latency</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value ${statusClass}">${status.toUpperCase()}</div>
                            <div class="stat-label">Status</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${device.asn || 'N/A'}</div>
                            <div class="stat-label">ASN</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${formatDate(device.last_seen)}</div>
                            <div class="stat-label">Last Seen</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render stats summary
        function renderStats(devices) {
            const testnetDevices = devices.filter(d => d.network === 'testnet');
            const mainnetDevices = devices.filter(d => d.network === 'mainnet-beta');
            const onlineDevices = devices.filter(d => d.latency_status === 'online');
            
            const avgLatency = devices.filter(d => d.latency).reduce((sum, d) => sum + d.latency, 0) / devices.filter(d => d.latency).length || 0;

            statsSummary.innerHTML = `
                <div class="summary-card">
                    <div class="summary-value">${devices.length}</div>
                    <div class="summary-label">Total Devices</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">${testnetDevices.length}</div>
                    <div class="summary-label">Testnet Devices</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">${mainnetDevices.length}</div>
                    <div class="summary-label">Mainnet-Beta Devices</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">${onlineDevices.length}</div>
                    <div class="summary-label">Online Devices</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">${Math.round(avgLatency)}ms</div>
                    <div class="summary-label">Avg Latency</div>
                </div>
            `;
        }

        // Utility functions
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleTimeString();
        }

        function showLoading() {
            loading.style.display = 'block';
            deviceGrid.style.display = 'none';
            error.style.display = 'none';
        }

        function hideLoading() {
            loading.style.display = 'none';
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            error.style.display = 'block';
            deviceGrid.style.display = 'none';
            statusIndicator.textContent = '⚠️ Connection Error';
            statusIndicator.style.background = 'var(--accent-danger)';
        }

        function hideError() {
            error.style.display = 'none';
            statusIndicator.textContent = '⚡ Online - Monitoring Both Networks';
            statusIndicator.style.background = 'var(--accent-success)';
        }
    </script>
</body>
</html>
